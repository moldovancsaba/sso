name: Repo Guardrails

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # WHAT: full history and tags.
          # WHY: check-release-integrity.mjs compares HEAD against the tag matching the
          #      current version. The default shallow checkout fetches no tags, so the
          #      check would find nothing to compare and pass silently - worse than not
          #      running it, because it would look like it had.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GDS_PACKAGES_TOKEN }}

      - name: Run lint
        run: npm run lint

      - name: Run type checks
        run: npm run type-check

      # WHAT: the production build, in CI, before anything merges.
      # WHY: this was the one gate that ran only on Vercel — i.e. only during the
      #      deploy itself, where a failure takes down login for every dependent app.
      #      next.config.js documents a real build race that was only ever observed
      #      there; now it gets exercised on every push and pull request first.
      - name: Run production build
        run: npm run build

      - name: Enforce repository guardrails
        run: node scripts/check-repo-guardrails.mjs

      - name: Check documentation maintenance rules
        run: node scripts/check-docs-maintenance.mjs

      # WHAT: only on pushes to main.
      # WHY: on a feature branch package.json legitimately still carries the last released
      #      version until the bump commit, so running this on pull_request would fail
      #      every branch that has not bumped yet. The contract it enforces belongs to
      #      main: what is on main must not claim a version that is already published.
      - name: Check release integrity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-release-integrity.mjs

      # WHAT: GDS manifest validation and compliance check.
      # WHY: gds-adoption.json declares bannedImports and protectedSurfacePaths, but
      #      until now no automation ran the scripts that enforce them — the manifest
      #      was a promise nothing kept (a stale protectedSurfacePaths entry survived
      #      for two releases because of exactly this).
      - name: Validate GDS manifest
        run: npm run gds:validate-manifest

      - name: Check GDS compliance
        run: npm run gds:check

      # WHAT: the same `npm test` developers run, plus --runInBand for CI stability.
      # WHY: invoking jest directly here duplicated the npm script and the two had
      #      already drifted; one invocation path means one thing to keep correct.
      - name: Run contract tests
        run: npm test -- --runInBand
